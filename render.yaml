services:
  - type: web
    name: weichat-sync
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8765
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /opt/render/local/src/data/weichat_sync.db
